<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice2Invoice</title>
    <meta name="description" content="Speak about a job. Get a professional invoice." />
    <meta name="theme-color" content="#090b0c" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Paint the canvas before React mounts, so there is no flash. */
      html, body { background: #090b0c; margin: 0; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f6f6; }
    </style>
    <script>
      // Apply the saved theme before first paint (default: dark).
      (function () {
        var t = 'dark';
        try { t = localStorage.getItem('v2i-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f4f6f6' : '#090b0c');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
